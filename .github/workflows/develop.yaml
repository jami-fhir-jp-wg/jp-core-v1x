name: JPCore FHIR develop Task
on:
  push:
    branches:
      - 'develop'
      - 'release/**'
    paths:
      - 'sushi-config.yaml'
      - 'input/**'
      - '.github/workflows/develop.yaml'
      - '.github/workflows/_build.yaml'
  pull_request:
    branches:
      - 'develop'
      - 'release/**'
jobs:
  call-build:
    uses: ./.github/workflows/_build.yaml
    with:
      release-version: '1.3.0-dev'
      ig-publisher-tag: '2.0.25'
      release-label: 'ci-build'
    secrets: inherit